<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Haven - Reservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container mt-4">
        <h2 class="mb-4">Book a Table</h2>
        <form onsubmit="handleReservation(event)" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" id="resName" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" id="resEmail" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Phone</label>
                <input type="tel" id="resPhone" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Number of Guests</label>
                <input type="number" id="resGuests" class="form-control" min="1" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Date</label>
                <input type="date" id="resDate" class="form-control" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Time</label>
                <input type="time" id="resTime" class="form-control" required>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary-custom">Confirm Reservation</button>
            </div>
        </form>
    </div>

    <div class="modal fade" id="resModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Reservation Confirmed</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <pre id="resSummaryDetails"></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

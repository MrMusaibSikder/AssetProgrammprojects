<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gourmet Haven - Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger" href="index.html">Gourmet Haven</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="menu.html">Menu</a>
                <a class="nav-link" href="reservation.html">Reservation</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Home</a></li>
                <li class="breadcrumb-item active">Menu</li>
            </ol>
        </nav>

        <div class="row g-4 mt-1">
            <div class="col-md-3">
                <h5 class="mb-3">Categories</h5>
                <div class="accordion" id="categoryAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#cat1">Starters</button>
                        </h2>
                        <div id="cat1" class="accordion-collapse collapse show" data-bs-parent="#categoryAccordion">
                            <div class="accordion-body">
                                <ul class="list-unstyled mb-0">
                                    <li><a href="#" class="text-decoration-none text-dark">Soups</a></li>
                                    <li><a href="#" class="text-decoration-none text-dark">Salads</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#cat2">Main Course</button>
                        </h2>
                        <div id="cat2" class="accordion-collapse collapse" data-bs-parent="#categoryAccordion">
                            <div class="accordion-body">
                                <ul class="list-unstyled mb-0">
                                    <li><a href="#" class="text-decoration-none text-dark">Chicken</a></li>
                                    <li><a href="#" class="text-decoration-none text-dark">Beef</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="card h-100">
                            <img src="images/special-1.jpg" class="card-img-top" alt="Food">
                            <div class="card-body">
                                <h5>Chicken Soup</h5>
                                <p class="text-muted">$8.00</p>
                                <a href="dish-detail.html" class="btn btn-primary-custom btn-sm">Add to Cart</a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card h-100">
                            <img src="images/special-2.jpg" class="card-img-top" alt="Food">
                            <div class="card-body">
                                <h5>Caesar Salad</h5>
                                <p class="text-muted">$10.00</p>
                                <a href="dish-detail.html" class="btn btn-primary-custom btn-sm">Add to Cart</a>
                            </div>
                        </div>
                    </div>
                </div>

                <nav class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">Next</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

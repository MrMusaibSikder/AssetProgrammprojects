<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIM Fashion - Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg custom-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html"><i class="fa-solid fa-shirt me-2"></i>NIM Fashion</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button class="btn btn-outline-light position-relative" onclick="location.href='cart.html'">
                            <i class="fa-solid fa-cart-shopping"></i>
                            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h3 class="fw-bold mb-4"><i class="fa-solid fa-cart-shopping me-2"></i>My Shopping Cart</h3>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="cart-table-body">
                    <!-- Dynamic Data loaded via script.js -->
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <button class="btn btn-outline-danger" onclick="clearCart()">Clear Cart</button>
            <h4 class="fw-bold">Total: $<span id="cart-total">0.00</span></h4>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Cart Table Render Function
        document.addEventListener('DOMContentLoaded', renderCartTable);

        function renderCartTable() {
            const tableBody = document.getElementById('cart-table-body');
            const totalElement = document.getElementById('cart-total');
            if (!tableBody) return;

            tableBody.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-4">Your cart is empty!</td></tr>';
                totalElement.innerText = '0.00';
                return;
            }

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                tableBody.innerHTML += `
                    <tr>
                        <td>
                            <img src="${item.image}" width="50" height="50" class="rounded me-2" style="object-fit:cover;">
                            ${item.name}
                        </td>
                        <td>$${item.price.toFixed(2)}</td>
                        <td>${item.quantity}</td>
                        <td>$${itemTotal.toFixed(2)}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="removeItem(${index})"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `;
            });

            totalElement.innerText = total.toFixed(2);
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('nim_cart', JSON.stringify(cart));
            updateCartCount();
            renderCartTable();
        }

        function clearCart() {
            cart = [];
            localStorage.removeItem('nim_cart');
            updateCartCount();
            renderCartTable();
        }
    </script>
</body>
</html>
